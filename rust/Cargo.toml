[workspace]
resolver = "2"
members = [
    "crates/mixlyzer-core",
    "crates/mixlyzer-dsp",
    "crates/mixlyzer-store",
    "crates/mixlyzer-export",
    "crates/mixlyzer-sync",
    "crates/mixlyzer-ui",
    "crates/mixlyzer-app",
    "crates/mixlyzer-cli",
    "crates/mixlyzer-phrase",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "LGPL-3.0-or-later"
repository = "https://github.com/deveworld/Mixlyzer"

[workspace.dependencies]
mixlyzer-core = { path = "crates/mixlyzer-core" }
mixlyzer-dsp = { path = "crates/mixlyzer-dsp" }
mixlyzer-store = { path = "crates/mixlyzer-store" }
mixlyzer-export = { path = "crates/mixlyzer-export" }
mixlyzer-sync = { path = "crates/mixlyzer-sync" }
mixlyzer-ui = { path = "crates/mixlyzer-ui" }
mixlyzer-phrase = { path = "crates/mixlyzer-phrase" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
